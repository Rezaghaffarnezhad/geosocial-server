<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#17212b">
<title>GeoSocial Omni-Hybrid Pro v24.10</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root{
 --bg:#0e1621;--panel:#17212b;--solid:#17212b;--blue:#2aabee;
 --text:#f5f5f5;--muted:#879ab0;--border:#222f3e;
 --green:#2ecc71;--danger:#e74c3c;--in:transparent;--out:transparent;
 --radius:0px;--safe-bottom:env(safe-area-inset-bottom,0px);--keyboard-offset:0px;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);overscroll-behavior:none}
button,input,textarea{font:inherit}
button{color:inherit}
#map{position:absolute;inset:0;z-index:1}

.solid-box{background:var(--solid)!important;border:1px solid var(--border)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}

.top{position:absolute;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;z-index:10;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.search{display:flex;align-items:center;gap:10px;padding:9px 13px;border-radius:12px;pointer-events:auto;background:var(--solid);border:1px solid var(--border);box-shadow:0 4px 12px #0006}
.search input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#fff;font-size:14px;text-align:right}
.badge{background:#2aabee22;color:var(--blue);padding:4px 9px;border-radius:8px;font-size:11px;white-space:nowrap;cursor:pointer}
.stories{display:flex;gap:9px;overflow:auto;scrollbar-width:none;pointer-events:auto;padding:2px}
.stories::-webkit-scrollbar{display:none}
.story{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:55px;cursor:pointer}
.story-ring{width:50px;height:50px;padding:2px;border-radius:50%;background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);position:relative}
.story-ring.viewed{background:#657384}
.story-ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid var(--bg)}
.story span{max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px}

.public-feed-layer{
  position:absolute;left:10px;right:75px;
  bottom:calc(72px + var(--safe-bottom) + var(--keyboard-offset));
  z-index:45;display:none;flex-direction:column;gap:6px;pointer-events:none;
  max-height:300px;padding-right:2px;
}
.public-feed-layer.active{display:flex}
.public-feed-messages{
  flex:1;overflow-y:auto;max-height:220px;display:flex;flex-direction:column;gap:8px;
  scrollbar-width:thin;padding-top:10px;
  mask-image: linear-gradient(to bottom, transparent 0%, black 18%, black 100%);
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 18%, black 100%);
}
.public-feed-messages::-webkit-scrollbar{width:4px}
.public-feed-messages::-webkit-scrollbar-thumb{background:#222f3e;border-radius:4px}

.public-feed-item{background:transparent!important;border:none!important;box-shadow:none!important;padding:4px 8px;font-size:12px;pointer-events:auto;animation:fadeInUp .3s ease;max-width:78%;display:flex;flex-direction:column}
.public-feed-item.in{align-self:flex-end;align-items:flex-end;text-align:right}
.public-feed-item.out{align-self:flex-start;align-items:flex-start;text-align:right}
.public-feed-sender{font-size:10px;color:var(--blue);font-weight:650;margin-bottom:1px}
.public-feed-text{color:#fff;word-break:break-word;line-height:1.35}

.public-inputbar{display:none;align-items:center;gap:8px;background:var(--solid);border:1px solid var(--border);border-radius:14px;padding:6px 10px;pointer-events:auto;margin-top:4px;box-shadow:0 4px 15px #0008}
.public-feed-layer.active .public-inputbar{display:flex}
.public-inputbar input{flex:1;min-width:0;background:transparent;border:0;border-radius:0;padding:6px;color:#fff;font-size:13px;text-align:right;outline:0}
.public-send{width:34px;height:34px;border:0;border-radius:50%;background:var(--blue);cursor:pointer;flex:0 0 34px;display:grid;place-items:center;color:#fff}

@keyframes fadeInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.global-chat-widget{position:absolute;left:10px;bottom:calc(72px + var(--safe-bottom));z-index:35;display:flex;flex-direction:column;gap:8px;pointer-events:auto;align-items:flex-start}
.global-chat-btn{width:45px;height:45px;border-radius:12px;background:transparent;border:0;color:var(--blue);display:grid;place-items:center;cursor:pointer;font-size:22px}

.controls{position:absolute;right:10px;bottom:calc(78px + var(--safe-bottom));z-index:10;display:flex;flex-direction:column;align-items:center;gap:10px}
.ctrl{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;cursor:pointer;background:var(--solid);border:1px solid var(--border);box-shadow:0 2px 8px #0006}
.radius{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px}
.radius input{height:78px;writing-mode:vertical-lr;direction:rtl;accent-color:var(--blue)}
.radius>span::after{content:' km';font-size:10px;color:var(--muted)}
.radius>span b{font-size:13px}

.nav{position:absolute;left:10px;right:10px;bottom:max(8px,var(--safe-bottom));height:58px;z-index:50;border-radius:12px;display:flex;justify-content:space-around;align-items:center;background:var(--solid);border:1px solid var(--border);box-shadow:0 6px 20px #0008}
.navitem{color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;cursor:pointer;min-width:70px}
.navitem.active{color:var(--blue)}

.sheet{
  position:absolute;left:0;right:0;top:0;
  height:calc(100dvh - var(--keyboard-offset))!important;
  max-height:calc(100dvh - var(--keyboard-offset));
  z-index:60;background:var(--bg);border-radius:0;
  display:flex;flex-direction:column;
  transform:translateY(101%);transition:transform .25s ease, height 0.1s ease-out;
}
.sheet.open{transform:translateY(0)}
.chat-head{padding:max(10px,env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;justify-content:space-between;background:var(--solid);border-bottom:1px solid var(--border)}
.userinfo{display:flex;align-items:center;gap:10px;cursor:pointer}
.avatar{width:40px;height:40px;border-radius:50%;object-fit:cover}
.name{font-weight:650;font-size:14px}.status{font-size:11px;color:var(--blue)}

.messages{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:#0e1621;background-image:radial-gradient(#222f3e 1px,transparent 0);background-size:24px 24px}
.msg{max-width:80%;padding:8px 12px;border-radius:12px;font-size:13px;line-height:1.45;word-break:break-word;cursor:pointer;position:relative;background:var(--solid)!important;border:1px solid var(--border)!important}
.msg.in{align-self:flex-start;text-align:right}
.msg.out{align-self:flex-end;text-align:right}

.replybox{background:#0003;border-right:2px solid var(--blue);padding:3px 8px;border-radius:4px;margin-bottom:4px;font-size:11px;color:var(--muted);text-align:right}
.meta{font-size:10px;color:var(--blue);float:left;margin:4px 0 0 6px}
.replybar{display:none;padding:8px 14px;background:var(--solid);border-top:1px solid var(--border);font-size:12px;align-items:center;gap:10px}
.replybar.active{display:flex}.replybar div{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}

.inputbar{padding:10px 14px max(10px,env(safe-area-inset-bottom));background:var(--solid);display:flex;flex-direction:row;gap:8px;border-top:1px solid var(--border);width:100%;align-items:center}
.inputbar input{flex:1;min-width:0;background:#0e1621;border:1px solid var(--border);border-radius:20px;padding:10px 16px;color:#fff;outline:0;font-size:14px;text-align:right}
.send{width:40px;height:40px;border:0;border-radius:50%;background:var(--blue);cursor:pointer;flex:0 0 40px;display:grid;place-items:center}

.ctx{position:fixed;z-index:100;display:none;flex-direction:column;width:160px;background:var(--solid);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px #000b;overflow:hidden}
.ctx button{border:0;background:transparent;padding:11px 14px;text-align:right;cursor:pointer;display:flex;gap:10px;align-items:center;font-size:13px}
.ctx button:hover{background:#222f3e}

.modal{position:absolute;inset:0;z-index:70;background:var(--bg);transform:translateX(101%);transition:transform .25s ease;display:flex;flex-direction:column;height:100dvh}
.modal.open{transform:translateX(0)}
.modal-head{padding:15px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:var(--solid)}
.modal-body{padding:15px;overflow:auto;flex:1}
.list-item{display:flex;align-items:center;gap:12px;padding:12px 15px;border-bottom:1px solid var(--border);cursor:pointer}
.form{margin-bottom:14px}.form label{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}
.form input,.form textarea,.form select{width:100%;background:var(--solid);border:1px solid var(--border);border-radius:8px;padding:10px;color:#fff;outline:0}
.primary{width:100%;border:0;background:var(--blue);padding:12px;border-radius:8px;color:#fff;font-weight:700;cursor:pointer}
.profile{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.profile-avatar{width:90px;height:90px;border-radius:50%;object-fit:cover;border:3px solid var(--blue);cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin:10px 0}
.card{background:var(--solid);border:1px solid var(--border);padding:12px;border-radius:10px}
.toast{position:fixed;top:max(15px,env(safe-area-inset-top));left:50%;z-index:200;transform:translate(-50%,-140%);padding:10px 18px;border-radius:12px;background:var(--solid);border:1px solid var(--border);box-shadow:0 6px 20px #0008;font-size:12px;transition:transform .25s;pointer-events:none}
.toast.show{transform:translate(-50%,0)}

.my-loc{width:14px;height:14px;border-radius:50%;background:var(--blue);border:2px solid #fff;box-shadow:0 0 8px var(--blue)}

.person-card{position:absolute;left:12px;right:12px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:25;display:none;background:var(--solid);border:1px solid var(--border);border-radius:12px;padding:14px;box-shadow:0 10px 30px #000b}
.person-card.open{display:block}
.person-card-head{display:flex;align-items:center;gap:10px}.person-card-title{display:flex;flex-direction:column;gap:3px;flex:1}.person-card-title small,.person-card-bio,.person-card-meta{color:var(--muted);font-size:11px}.person-card-bio{margin:9px 2px;line-height:1.6}.person-card-meta{display:flex;justify-content:space-between;padding:7px 0}
.person-card-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.person-card-actions button{border:1px solid var(--border);background:#0e1621;color:#fff;border-radius:8px;padding:10px;cursor:pointer}
.person-card-actions button.chat-primary-btn{background:var(--blue);border-color:var(--blue);font-weight:650}

.map-pin-wrap{position:relative;display:flex;align-items:center;justify-content:center}
.map-pin-avatar{width:40px;height:40px;border-radius:50%;border:2px solid var(--blue);overflow:hidden;background:#0e1621;box-shadow:0 2px 6px #0008}
.map-pin-avatar img{width:100%;height:100%;object-fit:cover}
.status-led{position:absolute;bottom:0;right:0;width:11px;height:11px;border-radius:50%;border:2px solid #17212b;box-shadow:0 0 4px #000}
.status-led.online{background:var(--green)}
.pin-label{position:absolute;top:100%;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:9px;color:#fff;background:rgba(23,33,43,0.9);padding:1px 5px;border-radius:4px;margin-top:2px;border:1px solid var(--border)}

.story-viewer{position:absolute;inset:0;z-index:150;background:#000;display:none;flex-direction:column;justify-content:space-between;padding:max(10px,env(safe-area-inset-top)) 0 max(10px,env(safe-area-inset-bottom));touch-action:none;user-select:none}
.story-viewer.active{display:flex}
.stories-progress-container{display:flex;gap:4px;padding:0 10px;margin-bottom:8px}
.progress{flex:1;height:2px;background:#fff4;border-radius:2px;overflow:hidden}.fill{width:0;height:100%;background:#fff}
.story-top{position:relative;z-index:5;padding:0 12px}
.story-head{display:flex;align-items:center;gap:9px}
.story-head-text{display:flex;flex-direction:column;gap:1px;flex:1}.story-head-text small{font-size:9px;color:#bbb}
.story-icon{border:0;background:transparent;color:#fff;font-size:18px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.story-icon.action{font-size:20px}.story-icon.action.active{color:#ff5c7a}
.story-zone{position:absolute;top:65px;bottom:100px;width:35%;z-index:4;border:0;background:transparent}
.story-zone.prev{left:0}.story-zone.next{right:0}
.story-media-wrap{display:grid;place-items:center;flex:1;min-height:0;position:relative;z-index:2;width:100%;height:100%}
.story-media-wrap img, .story-media-wrap video{width:100%;height:100%;object-fit:cover}

.story-heart-pop{position:absolute;z-index:10;font-size:90px;color:#ff5c7a;transform:scale(0);transition:transform .2s cubic-bezier(0.175, 0.885, 0.32, 1.275);pointer-events:none}
.story-heart-pop.show{transform:scale(1)}

.story-bottom{position:relative;z-index:5;width:100%;padding:10px 12px;background:linear-gradient(to top, rgba(0,0,0,.9), transparent)}
.story-comments{max-height:100px;overflow:auto;margin-bottom:8px;display:flex;flex-direction:column;gap:4px}
.story-comment{background:rgba(255,255,255,.1);border-radius:8px;padding:6px 10px;font-size:12px;color:#fff;text-align:right}
.story-reply{display:flex;flex-direction:row-reverse;gap:8px;align-items:center}
.story-reply input{flex:1;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:10px 14px;color:#fff;outline:0;font-size:13px;text-align:right}
.story-reply button{width:38px;height:38px;border:0;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center}
.story-own{position:relative}
.story-own .add-story{position:absolute;right:-1px;bottom:-1px;width:18px;height:18px;border-radius:50%;background:var(--blue);display:grid;place-items:center;font-size:11px;border:2px solid var(--bg)}

.people-search{padding:12px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--solid);z-index:3}
.people-search input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;color:#fff;outline:0;text-align:right}
.empty-list{padding:30px;text-align:center;color:var(--muted)}
.permission-box{padding:12px;background:var(--solid);border:1px solid var(--border);border-radius:10px;margin-bottom:15px}
</style>
</head>
<body>

<div id="toast" class="toast">پیام سیستم</div>
<div id="map"></div>

<div id="publicFeedLayer" class="public-feed-layer">
  <div id="publicFeedMessages" class="public-feed-messages"></div>
  <div class="public-inputbar">
    <button class="public-send" onclick="sendPublicMessage()"><i class="fa-solid fa-paper-plane"></i></button>
    <input id="publicMsgInput" type="text" autocomplete="off" enterkeyhint="send" placeholder="پیام در چت عمومی..." onkeydown="handlePublicKeyDown(event)">
  </div>
</div>

<div id="globalChatWidget" class="global-chat-widget">
  <div id="globalChatBtn" class="global-chat-btn" onclick="togglePublicFeed()" title="نمایش/مخفی کردن چت عمومی"><i class="fa-solid fa-comments"></i></div>
</div>

<div id="personCard" class="person-card" aria-hidden="true">
  <div class="person-card-head">
    <img id="personCardAvatar" class="avatar" src="" onclick="openPersonProfile()">
    <div class="person-card-title"><b id="personCardName"></b><small id="personCardCaption"></small></div>
    <button class="story-icon" onclick="closePersonCard()"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <div id="personCardBio" class="person-card-bio"></div>
  <div class="person-card-meta"><span id="personCardDistance"></span><span id="personCardLocation">موقعیت روی نقشه</span></div>
  <div class="person-card-actions">
    <button onclick="openPersonProfile()"><i class="fa-regular fa-user"></i> پروفایل</button>
    <button class="chat-primary-btn" onclick="openPersonChat()"><i class="fa-regular fa-comment"></i> چت خصوصی</button>
    <button onclick="routeToPerson()"><i class="fa-solid fa-route"></i> مسیر</button>
  </div>
</div>

<div id="storyViewer" class="story-viewer" aria-label="نمایش استوری">
  <div class="story-top">
    <div id="storiesProgressContainer" class="stories-progress-container"></div>
    <div class="story-head">
      <img id="storyAvatar" class="avatar" src="" style="width:36px;height:36px">
      <div class="story-head-text"><b id="storyName"></b><small id="storyTime">اکنون</small></div>
      <button class="story-icon" onclick="closeStory()" aria-label="بستن"><i class="fa-solid fa-xmark"></i></button>
    </div>
  </div>

  <button class="story-zone prev" onclick="previousStory(event)" aria-label="قبلی"></button>
  <button class="story-zone next" onclick="nextStory(event)" aria-label="بعدی"></button>

  <div id="storyMediaWrap" class="story-media-wrap">
    <img id="storyMedia" src="" alt="استوری">
    <i id="storyHeartPop" class="fa-solid fa-heart story-heart-pop"></i>
  </div>

  <div class="story-bottom" onclick="event.stopPropagation()">
    <div id="storyComments" class="story-comments"></div>
    <div class="story-reply">
      <button onclick="addStoryComment(event)" aria-label="ارسال"><i class="fa-solid fa-paper-plane"></i></button>
      <button id="storyLikeBtn" class="story-icon action" onclick="toggleStoryLike(event)"><i class="fa-regular fa-heart"></i></button>
      <input id="storyCommentInput" placeholder="ارسال پیام به سازنده..." autocomplete="off" onkeydown="if(event.key==='Enter')addStoryComment(event)">
    </div>
  </div>
  <input id="storyUploadInput" type="file" accept="image/*,video/*" hidden onchange="handleStoryUpload(event)">
</div>

<div class="top">
  <div class="search solid-box">
    <input id="searchInput" autocomplete="off" placeholder="جستجوی مکان، شهر یا آدرس..." onkeydown="handleSearch(event)">
    <span id="peopleBadge" class="badge" onclick="openPeopleFromBadge()">۰ فرد</span>
  </div>
  <div id="stories" class="stories"></div>
</div>

<div id="controls" class="controls">
  <div class="radius"><span><b id="radiusValue">5</b></span><input id="radius" type="range" min=".5" max="30" step=".5" value="5" oninput="setRadius(this.value)"></div>
  <div class="ctrl solid-box" onclick="requestLocation()" title="بروزرسانی موقعیت" style="color:var(--blue)"><i class="fa-solid fa-location-crosshairs"></i></div>
  <div id="clearRouteCtrl" class="ctrl solid-box" onclick="clearRoute()" title="پاک کردن مسیر" style="color:var(--danger);display:none"><i class="fa-solid fa-eraser"></i></div>
</div>

<div id="sheet" class="sheet">
  <div class="chat-head">
    <div class="userinfo" onclick="openActivePinProfile()">
      <img id="sheetAvatar" class="avatar" src="">
      <div><div id="sheetName" class="name">-</div><div id="sheetStatus" class="status">-</div></div>
    </div>
    <div style="display:flex;gap:18px;font-size:18px;color:var(--muted)">
      <i id="routeIconBtn" class="fa-solid fa-diamond-turn-right" style="color:var(--blue);cursor:pointer" onclick="drawRoute()"></i>
      <i class="fa-solid fa-xmark" style="cursor:pointer" onclick="closeSheet()"></i>
    </div>
  </div>
  <div id="chatMessages" class="messages" oncontextmenu="event.preventDefault()"></div>
  <div id="replyBar" class="replybar"><div id="replyText"></div><i class="fa-solid fa-xmark" style="cursor:pointer" onclick="cancelReply()"></i></div>
  
  <div class="inputbar">
    <button class="send" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
    <input id="msgInput" type="text" enterkeyhint="send" autocomplete="off" placeholder="نوشتن پیام خصوصی..." onkeydown="if(event.key==='Enter')sendMessage()">
  </div>
</div>

<div id="ctx" class="ctx">
  <button onclick="ctxReply()"><i class="fa-solid fa-reply"></i> ریپلای</button>
  <button onclick="ctxCopy()"><i class="fa-solid fa-copy"></i> کپی متن</button>
  <button id="ctxEdit" onclick="ctxEdit()"><i class="fa-solid fa-pen"></i> ویرایش</button>
  <button id="ctxDelete" onclick="ctxDelete()" style="color:var(--danger)"><i class="fa-solid fa-trash"></i> حذف</button>
</div>

<div id="chatsModal" class="modal">
  <div class="modal-head"><h3>چت‌های خصوصی</h3><i class="fa-solid fa-xmark" onclick="closeModals()" style="cursor:pointer"></i></div>
  <div class="people-search"><input id="chatsSearch" type="search" placeholder="جستجو در چت‌ها..." oninput="renderDirectChatsList(this.value)"></div>
  <div id="chatsList" class="modal-body" style="padding:0"></div>
</div>

<div id="peopleModal" class="modal">
  <div class="modal-head"><h3>کل افراد حاضر (<span id="peopleCount">0</span>)</h3><i class="fa-solid fa-xmark" onclick="closeModals()" style="cursor:pointer"></i></div>
  <div class="people-search"><input id="peopleSearch" type="search" placeholder="جستجو در افراد..." oninput="openPeople(this.value)"></div>
  <div id="peopleList" class="modal-body" style="padding:0"></div>
</div>

<div id="profileModal" class="modal">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
'use strict';

const defaultState={
  user:{
    name:'کاربر من', username:'my_user',
    bio:'آماده برای ارتباطات جدید', city:'تهران',
    avatar:'https://i.pravatar.cc/150?img=33', ghost:false,
    onlineStatus:true, unknownMessages:true, notifMessages:true, notifStories:true,
    readReceipts:true, storyAutoplay:true, sound:true, preciseLocation:true,
    saveHistory:true, showDistance:true, twoStep:false, darkMode:true, globalSearch:true
  },
  coords:{lat:35.6892,lng:51.3890},
  radius:5,
  publicChat:[],
  stories:[],
  pins:[] // کاملاً خالی از افراد فیک
};

function clone(x){return JSON.parse(JSON.stringify(x))}
let state=clone(defaultState);
let activePin=null, selectedMsg=null, replyMsg=null, editId=null;
let map, clusters, myMarker, routeLayer, storyTimer;

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(t){
  const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');
  clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2600)
}
function dist(a,b,c,d){
  const R=6371, p=Math.PI/180, x=(c-a)*p, y=(d-b)*p;
  const q=Math.sin(x/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(y/2)**2;
  return 2*R*Math.atan2(Math.sqrt(q),Math.sqrt(1-q))
}

map=L.map('map',{zoomControl:false,preferCanvas:true}).setView([state.coords.lat,state.coords.lng],13);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
  maxZoom:19,attribution:'&copy; OpenStreetMap contributors &copy; CARTO'
}).addTo(map);
clusters=L.markerClusterGroup({showCoverageOnHover:false,removeOutsideVisibleBounds:true}).addTo(map);

// دریافت اطلاعات زنده از دیتابیس
async function loadServerData() {
  try {
    const res = await fetch('/api/data');
    if (!res.ok) throw Error();
    const data = await res.json();
    if (data.pins) state.pins = data.pins;
    if (data.publicChat) state.publicChat = data.publicChat;
    if (data.stories) state.stories = data.stories;
    
    renderMap();
    renderStories();
    if(document.getElementById('publicFeedLayer').classList.contains('active')) {
      renderPublicFeed();
    }
  } catch (e) {
    console.error("خطا در همگام‌سازی با دیتابیس");
  }
}

function updateMyMarker(){
  if(myMarker){map.removeLayer(myMarker);myMarker=null}
  if(state.user.ghost)return;
  const icon=L.divIcon({className:'',html:'<div class="my-loc"></div>',iconSize:[14,14],iconAnchor:[7,7]});
  myMarker=L.marker([state.coords.lat,state.coords.lng],{icon,zIndexOffset:1000}).addTo(map)
}

function mapPinIcon(p){
  const statusClass=p.status==='online'?'online':'offline';
  const showName=(map.getZoom()>=17);
  const label=showName?`<span class="pin-label">${esc(p.name)}</span>`:'';
  return L.divIcon({
    className:'',
    html:`<div class="map-pin-wrap"><div class="map-pin-avatar"><img src="${esc(p.avatar)}"></div><div class="status-led ${statusClass}"></div>${label}</div>`,
    iconSize:[40,40],
    iconAnchor:[20,20]
  });
}

function renderMap(){
  clusters.clearLayers();let n=0;
  state.pins.forEach(p=>{
    const d=dist(state.coords.lat,state.coords.lng,Number(p.lat),Number(p.lng));
    if(d>state.radius)return;n++;
    const m=L.marker([Number(p.lat),Number(p.lng)],{icon:mapPinIcon(p)});
    m.on('click',e=>{L.DomEvent.stopPropagation(e);activePin=p;openPersonCard(p,true)});
    clusters.addLayer(m)
  });
  document.getElementById('peopleBadge').textContent=`${state.pins.length} فرد`;
  updateMyMarker()
}
map.on('zoomend',renderMap);

let radiusCircle=null;
function setRadius(v){
  state.radius=Number(v);
  document.getElementById('radiusValue').textContent=String(state.radius).replace('.0','');
  drawRadiusCircle();renderMap();
}
function drawRadiusCircle(){
  if(radiusCircle){map.removeLayer(radiusCircle);radiusCircle=null}
  radiusCircle=L.circle([state.coords.lat,state.coords.lng],{radius:state.radius*1000,color:'#2aabee',weight:2,fillOpacity:.06,interactive:false}).addTo(map);
}

function requestLocation(){
  if(!window.isSecureContext && location.hostname!=='localhost'){toast('برای GPS باید صفحه در HTTPS باز شود');return}
  if(!navigator.geolocation){toast('مرورگر شما GPS ندارد');return}
  navigator.geolocation.getCurrentPosition(p=>{
    state.coords={lat:p.coords.latitude,lng:p.coords.longitude};
    map.flyTo([state.coords.lat,state.coords.lng],16,{duration:.45});drawRadiusCircle();renderMap();
    toast('موقعیت GPS با موفقیت دریافت شد')
  },err=>{toast('خطا در دریافت موقعیت مکانی')},{enableHighAccuracy:true,timeout:15000,maximumAge:15000})
}

let searchLayer=null;
async function handleSearch(e){
  if(e.key!=='Enter')return;
  const q=e.target.value.trim();if(!q)return;
  toast('در حال جستجوی مکان...');
  try{
    const url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=8&addressdetails=1&accept-language=fa&q='+encodeURIComponent(q);
    const r=await fetch(url);if(!r.ok)throw Error();
    const data=await r.json();if(!data.length){toast('مکان موردنظر پیدا نشد');return}
    if(searchLayer)map.removeLayer(searchLayer);
    searchLayer=L.layerGroup().addTo(map);
    const bounds=[];
    data.forEach((x,i)=>{
      const lat=Number(x.lat),lng=Number(x.lon);if(!Number.isFinite(lat)||!Number.isFinite(lng))return;
      bounds.push([lat,lng]);
      const m=L.marker([lat,lng]).bindPopup('<b>'+esc(x.display_name)+'</b>').addTo(searchLayer);
      if(i===0)m.openPopup();
    });
    if(bounds.length===1)map.flyTo(bounds[0],16,{duration:.5}); else map.fitBounds(bounds,{padding:[50,50],maxZoom:16});
    toast('نتایج مکان نمایش داده شد')
  }catch(err){toast('خطا در جستجوی مکان')}
}

function renderStories(){
  const box=document.getElementById('stories');box.innerHTML='';
  const own=document.createElement('div');own.className='story story-own';own.onclick=()=>openOwnStoryMenu();
  own.innerHTML=`<div class="story-ring"><img src="${esc(state.user.avatar)}" alt=""><span class="add-story">+</span></div><span>استوری شما</span>`;
  box.appendChild(own);
  state.stories.forEach((s,i)=>{
    const d=document.createElement('div');d.className='story';d.onclick=()=>openStory(i);
    d.innerHTML=`<div class="story-ring ${s.viewed?'viewed':''}"><img src="${esc(s.avatar)}" alt=""></div><span>${esc(s.name)}</span>`;
    box.appendChild(d)
  })
}

function normalizeStory(s){
  s.likes=Number.isFinite(s.likes)?s.likes:0;
  s.likedByMe=!!s.likedByMe;
  s.comments=Array.isArray(s.comments)?s.comments:[];
  s.saved=!!s.saved;s.viewed=!!s.viewed;
  return s;
}

let currentStory=-1, storyPaused=false, storyHoldTimer=null, storyTouchStart=null, lastStoryTap=0;

function renderStoryProgressBars(){
  const container=document.getElementById('storiesProgressContainer');
  container.innerHTML='';
  state.stories.forEach((_,i)=>{
    const p=document.createElement('div');p.className='progress';
    const f=document.createElement('div');f.className='fill';
    if(i<currentStory) f.style.width='100%';
    p.appendChild(f);
    container.appendChild(p);
  });
}

function startStoryTimer(){
  clearTimeout(storyTimer);
  if(storyPaused || currentStory<0 || state.user.storyAutoplay===false)return;
  renderStoryProgressBars();
  const fills=document.querySelectorAll('.stories-progress-container .fill');
  if(fills[currentStory]){
    fills[currentStory].style.transition='none';fills[currentStory].style.width='0';
    requestAnimationFrame(()=>{if(!storyPaused){fills[currentStory].style.transition='width 5s linear';fills[currentStory].style.width='100%'}});
  }
  storyTimer=setTimeout(nextStory,5000)
}

function openStory(i){
  if(!state.stories[i])return;
  currentStory=i;
  const s=normalizeStory(state.stories[i]);s.viewed=true;renderStories();
  document.getElementById('storyAvatar').src=s.avatar;
  document.getElementById('storyName').textContent=s.name;
  document.getElementById('storyMedia').src=s.media;
  document.getElementById('storyLikeBtn').classList.toggle('active',s.likedByMe);
  document.getElementById('storyLikeBtn').innerHTML=s.likedByMe?'<i class="fa-solid fa-heart"></i>':'<i class="fa-regular fa-heart"></i>';
  document.getElementById('storyComments').innerHTML=s.comments.map(c=>`<div class="story-comment"><b>${esc(c.name)}:</b> ${esc(c.text)}</div>`).join('');
  document.getElementById('storyViewer').classList.add('active');
  storyPaused=false;startStoryTimer();
}

function closeStory(){clearTimeout(storyTimer);clearTimeout(storyHoldTimer);currentStory=-1;storyPaused=false;document.getElementById('storyViewer').classList.remove('active')}
function previousStory(e){e?.stopPropagation();if(!state.stories.length)return;openStory((currentStory-1+state.stories.length)%state.stories.length)}
function nextStory(e){e?.stopPropagation();if(currentStory<0)return;if(currentStory>=state.stories.length-1){closeStory();return}openStory(currentStory+1)}
function pauseStory(){if(currentStory<0)return;storyPaused=true;clearTimeout(storyTimer);const fills=document.querySelectorAll('.stories-progress-container .fill');if(fills[currentStory])fills[currentStory].style.transition='none'}
function resumeStory(){if(currentStory<0)return;storyPaused=false;startStoryTimer()}

function toggleStoryLike(e){
  e?.stopPropagation();if(currentStory<0)return;
  const s=normalizeStory(state.stories[currentStory]);s.likedByMe=!s.likedByMe;s.likes=Math.max(0,s.likes+(s.likedByMe?1:-1));
  openStory(currentStory)
}

function handleStoryMediaTap(e){
  const now=Date.now();
  if(now-lastStoryTap<300){
    const s=normalizeStory(state.stories[currentStory]);
    if(!s.likedByMe){s.likedByMe=true;s.likes++;}
    openStory(currentStory);
    const pop=document.getElementById('storyHeartPop');
    pop.style.left=(e.clientX-45)+'px';pop.style.top=(e.clientY-45)+'px';
    pop.classList.add('show');setTimeout(()=>pop.classList.remove('show'),600);
  }
  lastStoryTap=now;
}

function addStoryComment(e){
  e?.stopPropagation();if(currentStory<0)return;
  const input=document.getElementById('storyCommentInput'),text=input.value.trim();if(!text)return;
  const s=normalizeStory(state.stories[currentStory]);s.comments.push({id:Date.now(),name:state.user.name,text});
  input.value='';openStory(currentStory)
}
function openOwnStoryMenu(){document.getElementById('storyUploadInput').click()}
function handleStoryUpload(e){
  const f=e.target.files?.[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{
    state.stories.unshift({id:Date.now(),name:state.user.name,avatar:state.user.avatar,media:r.result,viewed:false,likes:0,likedByMe:false,comments:[]});
    renderStories();openStory(0);e.target.value='';
  };r.readAsDataURL(f)
}

const sv=document.getElementById('storyViewer');
sv.addEventListener('pointerdown',e=>{
  if(e.target.closest('.story-bottom,.story-icon'))return;
  storyTouchStart={x:e.clientX,y:e.clientY,time:Date.now()};
  storyHoldTimer=setTimeout(pauseStory,260);
});
sv.addEventListener('pointerup',e=>{
  clearTimeout(storyHoldTimer);
  if(!storyTouchStart)return;
  const dx=e.clientX-storyTouchStart.x,dy=e.clientY-storyTouchStart.y;
  if(storyPaused && Math.abs(dx)<35 && Math.abs(dy)<35){resumeStory();}
  else if(Math.abs(dx)>70){dx>0?previousStory(e):nextStory(e)}
  else if(dy>100){closeStory()}
  else if(Date.now()-storyTouchStart.time<260 && Math.abs(dx)<10 && Math.abs(dy)<10){
    handleStoryMediaTap(e);
    if(e.clientX<innerWidth*.33)previousStory(e);
    else if(e.clientX>innerWidth*.67)nextStory(e);
  }
  storyTouchStart=null;
});
sv.addEventListener('pointercancel',()=>{clearTimeout(storyHoldTimer);storyTouchStart=null;resumeStory()});

if(window.visualViewport){
  window.visualViewport.addEventListener('resize', () => {
    const root = document.documentElement;
    const vh = window.innerHeight;
    const vvpHeight = window.visualViewport.height;
    const keyboardHeight = (vh - vvpHeight > 120) ? (vh - vvpHeight) : 0;
    root.style.setProperty('--keyboard-offset', keyboardHeight + 'px');
  });
}

function togglePublicFeed(){
  const feed=document.getElementById('publicFeedLayer');
  feed.classList.toggle('active');
  if(feed.classList.contains('active')){
    renderPublicFeed();
  } else {
    document.getElementById('publicMsgInput').blur();
  }
}

function renderPublicFeed(){
  const box=document.getElementById('publicFeedMessages');
  box.innerHTML='';
  let msgs = state.publicChat || [];
  if(msgs.length > 30) msgs = msgs.slice(msgs.length - 30);
  msgs.forEach(m=>{
    const isOut=m.sender_name===state.user.name || m.name===state.user.name;
    const item=document.createElement('div');
    item.className=`public-feed-item ${isOut?'out':'in'}`;
    const senderName = m.sender_name || m.name;
    const senderHtml = isOut ? '' : `<div class="public-feed-sender">${esc(senderName)}</div>`;
    item.innerHTML=`${senderHtml}<div class="public-feed-text">${esc(m.text)}</div>`;
    box.appendChild(item);
  });
  requestAnimationFrame(()=>box.scrollTop=box.scrollHeight);
}

async function sendPublicMessage(){
  const input=document.getElementById('publicMsgInput'), text=input.value.trim();
  if(!text)return;
  try {
    const res = await fetch('/api/public-chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: state.user.name,
        avatar: state.user.avatar,
        text: text
      })
    });
    if(res.ok) {
      const newMsg = await res.json();
      state.publicChat.push(newMsg);
      input.value='';
      renderPublicFeed();
    }
  } catch(e) {
    toast('خطا در ارسال پیام به سرور');
  }
}

function handlePublicKeyDown(e){
  if(e.key==='Enter' && !e.shiftKey){
    e.preventDefault();
    sendPublicMessage();
  }
}

function openDirectChatsModal(){
  renderDirectChatsList('');
  document.getElementById('chatsModal').classList.add('open');
}

function renderDirectChatsList(query=''){
  const box=document.getElementById('chatsList');box.innerHTML='';
  const q=String(query||'').trim().toLowerCase();let count=0;
  state.pins.forEach(p=>{
    if(!p.chat || p.chat.length===0)return;
    const lastMsg=p.chat[p.chat.length-1];
    const text=(p.name+' '+(lastMsg?.text||'')).toLowerCase();
    if(q && !text.includes(q))return;
    count++;
    const el=document.createElement('div');el.className='list-item';
    el.innerHTML=`<img src="${esc(p.avatar)}" style="width:45px;height:45px;border-radius:50%;object-fit:cover"><div style="flex:1"><b>${esc(p.name)}</b><div style="font-size:11px;color:var(--muted)">${esc(lastMsg?.text||'بدون پیام')}</div></div><i class="fa-solid fa-chevron-left" style="font-size:12px;color:var(--muted)"></i>`;
    el.onclick=()=>{closeModals();selectPin(p);};
    box.appendChild(el);
  });
  if(!count)box.innerHTML='<div class="empty-list">هیچ چت خصوصی فعالی وجود ندارد</div>';
}

function openPeople(query=''){
  const box=document.getElementById('peopleList');box.innerHTML='';
  const q=String(query||'').trim().toLowerCase();let n=0;
  state.pins.forEach(p=>{
    const d=dist(state.coords.lat,state.coords.lng,Number(p.lat),Number(p.lng));
    const text=(p.name+' '+(p.username||'')+' '+(p.caption||'')).toLowerCase();
    if(q && !text.includes(q))return;
    n++;
    const el=document.createElement('div');el.className='list-item';
    el.innerHTML=`<img src="${esc(p.avatar)}" style="width:45px;height:45px;border-radius:50%;object-fit:cover"><div style="flex:1"><b>${esc(p.name)}</b><div style="font-size:11px;color:var(--muted)">${d.toFixed(1)} کیلومتر • ${esc(p.caption||'کاربر')}</div></div><i class="fa-solid fa-location-dot" style="color:var(--blue)"></i>`;
    el.onclick=()=>{
      closeModals();
      map.flyTo([Number(p.lat),Number(p.lng)],17,{duration:.35});
      activePin=p;openPersonCard(p,true);
    };
    box.appendChild(el);
  });
  if(!n)box.innerHTML='<div class="empty-list">فردی پیدا نشد</div>';
  document.getElementById('peopleCount').textContent=n;
  document.getElementById('peopleModal').classList.add('open');
}
function openPeopleFromBadge(){openPeople(document.getElementById('peopleSearch').value);}

function openPersonCard(p){
  activePin=p;
  document.getElementById('personCardAvatar').src=p.avatar;
  document.getElementById('personCardName').textContent=p.name;
  document.getElementById('personCardCaption').textContent=p.caption||'کاربر GeoSocial';
  document.getElementById('personCardBio').textContent=p.bio||p.caption||'اطلاعات تکمیلی در دسترس نیست';
  document.getElementById('personCardDistance').textContent=dist(state.coords.lat,state.coords.lng,Number(p.lat),Number(p.lng)).toFixed(1)+' کیلومتر فاصله';
  document.getElementById('personCard').classList.add('open');
}
function closePersonCard(){document.getElementById('personCard').classList.remove('open')}
function openPersonChat(){if(!activePin)return;closePersonCard();closeModals();selectPinCore(activePin)}
function openPersonProfile(){
  if(!activePin)return;closePersonCard();
  refreshOtherProfile(activePin);
  document.getElementById('otherProfileModal').classList.add('open');
}
function refreshOtherProfile(p){
  document.getElementById('otherProfileAvatar').src=p.avatar;
  document.getElementById('otherProfileName').textContent=p.name;
  document.getElementById('otherProfileBio').textContent=p.bio||p.caption||'کاربر GeoSocial';
  document.getElementById('otherProfileDistance').textContent=dist(state.coords.lat,state.coords.lng,Number(p.lat),Number(p.lng)).toFixed(1)+' کیلومتر فاصله';
}
function routeToPerson(){if(activePin){closePersonCard();closeModals();drawRoute()}}

function selectPinCore(p){
  activePin=p;
  document.getElementById('sheetAvatar').src=p.avatar;
  document.getElementById('sheetName').textContent=p.name;
  document.getElementById('sheetStatus').textContent=p.status==='online'?'آنلاین':'آفلاین';
  renderMessages();
  document.getElementById('sheet').classList.add('open');
  map.flyTo([Number(p.lat),Number(p.lng)],15,{duration:.45});
  setTimeout(()=>document.getElementById('msgInput').focus({preventScroll:true}),120);
}
function selectPin(p){selectPinCore(p)}
function openActivePinProfile(){
  if(activePin){closeSheet();refreshOtherProfile(activePin);document.getElementById('otherProfileModal').classList.add('open')}
}
function renderMessages(){
  const box=document.getElementById('chatMessages');box.innerHTML='';
  (activePin?.chat||[]).forEach(m=>{
    const d=document.createElement('div');d.className='msg '+(m.out?'out':'in');
    d.oncontextmenu=e=>{e.preventDefault();openCtx(e,m)};
    d.onclick=e=>{e.stopPropagation();openCtx(e,m)};
    d.innerHTML=(m.replyTo?`<div class="replybox">ریپلای به: ${esc(m.replyTo)}</div>`:'')+esc(m.text)+(m.out?'<span class="meta"><i class="fa-solid fa-check-double"></i></span>':'');
    box.appendChild(d)
  });
  requestAnimationFrame(()=>box.scrollTop=box.scrollHeight);
}
function sendMessage(){
  const input=document.getElementById('msgInput'),text=input.value.trim();if(!text)return;
  if(!activePin)return;
  if(editId){
    const m=activePin.chat.find(x=>x.id===editId);if(m)m.text=text;editId=null;toast('پیام ویرایش شد');
  }else{
    activePin.chat=Array.isArray(activePin.chat)?activePin.chat:[];
    activePin.chat.push({id:Date.now(),text,out:true,replyTo:replyMsg?.text||null});
  }
  input.value='';cancelReply();renderMessages();
}
document.getElementById('msgInput').addEventListener('keydown',e=>{
  if(e.key==='Enter' && !e.shiftKey){e.preventDefault();sendMessage()}
});
function cancelReply(){replyMsg=null;document.getElementById('replyBar').classList.remove('active')}

function closeSheet(){document.getElementById('sheet').classList.remove('open');document.getElementById('msgInput').blur();}
function closeModals(){document.querySelectorAll('.modal').forEach(x=>x.classList.remove('open'))}

function openCtx(e,msg){
  selectedMsg=msg;
  const menu=document.getElementById('ctx');menu.style.display='flex';
  menu.style.left=Math.min(e.clientX,innerWidth-170)+'px';menu.style.top=Math.min(e.clientY,innerHeight-190)+'px';
  const own=!msg.in;document.getElementById('ctxEdit').style.display=own?'flex':'none';document.getElementById('ctxDelete').style.display=own?'flex':'none'
}
document.addEventListener('click',()=>document.getElementById('ctx').style.display='none');

function ctxReply(){
  if(!selectedMsg)return;
  replyMsg=selectedMsg;document.getElementById('replyText').textContent='پاسخ به: '+selectedMsg.text;
  document.getElementById('replyBar').classList.add('active');document.getElementById('msgInput').focus()
}
async function ctxCopy(){
  if(!selectedMsg)return;
  try{await navigator.clipboard.writeText(selectedMsg.text)}catch(e){}toast('متن کپی شد')
}
function ctxEdit(){
  if(!selectedMsg||selectedMsg.in)return;
  editId=selectedMsg.id;document.getElementById('msgInput').value=selectedMsg.text;document.getElementById('msgInput').focus()
}
function ctxDelete(){
  if(!selectedMsg)return;
  if(activePin){
    activePin.chat=activePin.chat.filter(x=>x.id!==selectedMsg.id);
    renderMessages();
  }
  toast('پیام حذف شد')
}

async function drawRoute(){
  if(!activePin)return;toast('در حال محاسبه مسیر...');
  if(routeLayer){map.removeLayer(routeLayer);routeLayer=null}
  try{
    const u=`https://router.project-osrm.org/route/v1/driving/${state.coords.lng},${state.coords.lat};${activePin.lng},${activePin.lat}?overview=full&geometries=geojson`;
    const r=await fetch(u);if(!r.ok)throw Error();
    const data=await r.json();if(!data.routes?.length)throw Error();
    const coords=data.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]);
    routeLayer=L.polyline(coords,{color:'#2aabee',weight:5,opacity:.85}).addTo(map);
    map.fitBounds(routeLayer.getBounds(),{padding:[45,45]});
    document.getElementById('clearRouteCtrl').style.display='grid';
    toast('مسیر ترسیم شد')
  }catch(e){toast('خطا در محاسبه مسیر')}
}

function clearRoute(){
  if(routeLayer){map.removeLayer(routeLayer);routeLayer=null}
  document.getElementById('clearRouteCtrl').style.display='none';
  toast('مسیر پاک شد');
}

function nav(tab,el){
  document.querySelectorAll('.navitem').forEach(x=>x.classList.remove('active'));el.classList.add('active');closeModals();closeSheet();
  const globalWidget = document.getElementById('globalChatWidget');
  const feedLayer = document.getElementById('publicFeedLayer');
  
  if(tab==='map'){globalWidget.style.display='flex';}
  else{globalWidget.style.display='none';feedLayer.classList.remove('active');}

  if(tab==='chats')openDirectChatsModal();
  if(tab==='profile')openProfile()
}

function refreshProfile(){
  document.getElementById('profileName').textContent=state.user.name;
  document.getElementById('profileBio').textContent=(state.user.username?'@'+state.user.username+' • ':'')+(state.user.city||'')+' • '+state.user.bio;
  document.getElementById('profileAvatar').src=state.user.avatar;
  document.getElementById('connectionCount').textContent=state.pins.filter(p=>p.isConnected).length
}
function openProfile(){refreshProfile();document.getElementById('profileModal').classList.add('open')}
function openSettings(){
  closeModals();
  const u=state.user;
  document.getElementById('settingsName').value=u.name;document.getElementById('settingsUsername').value=u.username||'';
  document.getElementById('settingsBio').value=u.bio;document.getElementById('settingsCity').value=u.city||'';
  document.getElementById('settingsModal').classList.add('open')
}
function saveSettings(){
  const u=state.user;
  u.name=document.getElementById('settingsName').value.trim()||u.name;u.username=document.getElementById('settingsUsername').value.trim()||u.username;
  u.bio=document.getElementById('settingsBio').value.trim()||u.bio;u.city=document.getElementById('settingsCity').value.trim()||u.city;
  closeModals();refreshProfile();renderStories();toast('تنظیمات ذخیره شد')
}
function uploadPhoto(){document.getElementById('photoInput').click()}
function handlePhoto(e){
  const file=e.target.files?.[0];if(!file)return;
  const r=new FileReader();r.onload=()=>{state.user.avatar=r.result;refreshProfile();renderStories();toast('عکس پروفایل به‌روز شد')};r.readAsDataURL(file)
}

document.getElementById('radius').value=state.radius;
document.getElementById('radiusValue').textContent=String(state.radius).replace('.0','');

// دریافت اطلاعات و همگام‌سازی خودکار هر ۱۰ ثانیه
loadServerData();
setInterval(loadServerData, 10000);

drawRadiusCircle();
requestLocation(); // درخواست خودکار GPS هنگام ورود به برنامه
setTimeout(()=>map.invalidateSize(),250);
window.addEventListener('resize',()=>map.invalidateSize());
</script>
</body>
</html>
